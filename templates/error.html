{% extends "base.html" %}
{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card vault-card p-5 border-secondary shadow-lg">
                <div class="mb-4">
                    {% if code == 404 %}
                        <i class="fa-solid fa-compass-drafting text-info display-1"></i>
                    {% elif code == 403 %}
                        <i class="fa-solid fa-shield-virus text-danger display-1"></i>
                    {% elif code == 429 %}
                        <i class="fa-solid fa-hourglass-half text-warning display-1"></i>
                    {% else %}
                        <i class="fa-solid fa-triangle-exclamation text-danger display-1"></i>
                    {% endif %}
                </div>
                <h1 class="display-5 fw-bold text-white mb-2">{{ code }}</h1>
                <h4 class="text-info mb-3">{{ title }}</h4>
                <p class="text-muted mb-4 lead fs-6">
                    {{ description }}
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('dashboard') if 'user_id' in session else url_for('login') }}" class="btn btn-cyan">
                        <i class="fa-solid fa-house me-2"></i> Return to Safe Perimeter
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
