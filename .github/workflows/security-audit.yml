name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * 1"

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-tools and pip-audit
        run: pip install pip-tools pip-audit

      - name: Verify lockfile is up-to-date
        run: |
          pip-compile --generate-hashes --output-file requirements.lock.ci requirements.txt
          diff requirements.lock requirements.lock.ci || \
            (echo "::error::requirements.lock is out of date. Run: pip-compile --generate-hashes -o requirements.lock requirements.txt" && exit 1)

      - name: Audit for known vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt --strict

  symbol-audit:
    name: Native Library Symbol Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native library
        run: |
          sudo apt-get install -y --no-install-recommends build-essential
          make -C securebox/crypto_asm clean all

      - name: Assert asm_rc4_init is NOT exported
        run: |
          if nm -D securebox/crypto_asm/libcrypto_asm.so | grep -q ' T asm_rc4_init$'; then
            echo "::error::asm_rc4_init is still exported from the shared library"
            exit 1
          fi
          echo "PASS: asm_rc4_init is not in the dynamic symbol table"

      - name: Assert expected symbols ARE exported
        run: |
          for sym in asm_rc4_init_safe asm_rc4_crypt asm_aes128_cbc_encrypt asm_aes128_cbc_decrypt asm_des_cbc_crypt; do
            if ! nm -D securebox/crypto_asm/libcrypto_asm.so | grep -q " T $sym"; then
              echo "::error::Expected symbol $sym is missing from libcrypto_asm.so"
              exit 1
            fi
          done
          echo "PASS: all expected symbols present"

      - name: Assert hardening flags (RELRO, NX stack, stack canary)
        run: |
          checksec --file=securebox/crypto_asm/libcrypto_asm.so --output=json || \
            sudo apt-get install -y checksec && checksec --file=securebox/crypto_asm/libcrypto_asm.so
