events { worker_connections 256; }

http {
    server_tokens off;
    client_body_timeout 20s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_max_body_size 21m;

    upstream securebox_api { server securebox:8000; keepalive 8; }

    server {
        listen 80;
        server_name _;
        location / {
            proxy_pass http://securebox_api;
            proxy_http_version 1.1;
            # Preserve the public port so same-origin checks see the browser's
            # exact host:port (for example localhost:8081 in local Compose).
            proxy_set_header Host $http_host;
            # The local gateway is the only trusted proxy. Replace any client
            # value instead of preserving a spoofable forwarded chain.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
            proxy_request_buffering off;
        }
    }
}
